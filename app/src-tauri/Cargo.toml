[package]
name = "agentrelay-app"
version = "0.1.0"
edition = "2021"
description = "Desktop app for AgentRelay — supervise overnight AI coding-agent runs"
authors = ["MalyStern"]

# The desktop app deliberately does NOT depend on the daemon crate. It talks to the
# running daemon over its loopback HTTP API (the same surface a browser UI uses), so
# it can be built, shipped, and updated independently of the daemon's internals — and
# so the two can be worked on at the same time without colliding.
[lib]
name = "agentrelay_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
