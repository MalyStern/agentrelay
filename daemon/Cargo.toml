[package]
name = "agentrelay"
version = "0.0.1"
edition = "2021"
description = "AgentRelay daemon core: the single source of truth that supervises overnight AI-coding-agent runs."
license = "MIT"

[lib]
name = "agentrelay"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
keyring = "3"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"

[[bin]]
name = "agentrelay"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
# Faster incremental test cycles.
opt-level = 0
