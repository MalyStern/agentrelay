[package]
name = "agentrelay"
version = "0.0.1"
edition = "2021"
description = "AgentRelay daemon core: the single source of truth that supervises overnight AI-coding-agent runs."
license = "MIT"

[lib]
name = "agentrelay"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

[profile.dev]
# Faster incremental test cycles.
opt-level = 0
