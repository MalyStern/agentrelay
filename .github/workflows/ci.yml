name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runner:
    name: runner (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # node:sqlite is used by the store; needs Node 22.5+ (unflagged on 24).
        node: [22, 24]
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
